[package]
name = "qoder-creator"
version = "1.0.0"
edition = "2021"
description = "Qoder auto register + claim pro trial + inject 9Router"

[dependencies]
anyhow = "1"
headless_chrome = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
rand = "0.8"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
